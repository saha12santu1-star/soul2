name: Build Soul2 Navigation Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Install required tools
        run: sudo apt-get update && sudo apt-get install -y python3 curl zip unzip

      - name: Fetch Soul2 RC8
        run: |
          git clone --depth 1 --branch v2.0.0-rc.8 \
            https://git.kaki87.net/VibedByKaKi/soul-browser.git soul2

      - name: Patch verified onPageStarted entry
        working-directory: soul2
        run: |
          cat > /tmp/patch_soul2.py <<'PYCODE'
          from pathlib import Path

          path = Path('app/smali_classes3/com/mycompany/app/web/WebViewActivity$LocalWebViewClient.smali')
          if not path.is_file():
              raise SystemExit(f'RC8 source file not found: {path}')

          text = path.read_text()
          signature = '.method public final onPageStarted(Landroid/webkit/WebView;Ljava/lang/String;Landroid/graphics/Bitmap;)V'
          if text.count(signature) != 1:
              raise SystemExit('Expected exactly one RC8 onPageStarted method; refusing to patch.')

          start = text.index(signature)
          end = text.index('.end method', start)
          method = text[start:end]
          if 'SOUL2_EXAMPLE_DOMAIN_TEST' in method:
              raise SystemExit('Patch marker already exists; refusing to patch twice.')

          old_locals = '    .locals 3'
          if method.count(old_locals) != 1:
              raise SystemExit('Expected .locals 3 in onPageStarted; refusing to guess register allocation.')

          method = method.replace(old_locals, '    .locals 4', 1)
          insertion = [
              '    # SOUL2_EXAMPLE_DOMAIN_TEST',
              '    if-eqz p2, :soul2_test_allow_page',
              '    const-string v3, \"example.com\"',
              '    invoke-virtual {p2, v3}, Ljava/lang/String;->contains(Ljava/lang/CharSequence;)Z',
              '    move-result v3',
              '    if-eqz v3, :soul2_test_allow_page',
              '    invoke-virtual {p1}, Landroid/webkit/WebView;->stopLoading()V',
              '    return-void',
              '    :soul2_test_allow_page',
              ''
          ]
          directive = '    .locals 4\n'
          if method.count(directive) != 1:
              raise SystemExit('Could not identify the updated locals directive.')
          method = method.replace(directive, directive + '\n'.join(insertion) + '\n', 1)
          text = text[:start] + method + text[end:]
          path.write_text(text)

          verify = path.read_text()
          s = verify.index(signature)
          e = verify.index('.end method', s)
          patched = verify[s:e]
          assert patched.index('.locals 4') < patched.index('SOUL2_EXAMPLE_DOMAIN_TEST')
          assert 'invoke-virtual {p1}, Landroid/webkit/WebView;->stopLoading()V' in patched
          print('Source patch checks passed. Test target: example.com')
          PYCODE
          python3 /tmp/patch_soul2.py

      - name: Build APK
        working-directory: soul2
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Find APK
        id: apk
        working-directory: soul2
        run: |
          apk=$(find dist -maxdepth 1 -type f -name '*.apk' \
            ! -name '*-unsigned.apk' ! -name '*-aligned.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "No signed APK found"
            ls -la dist/
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: soul2-navigation-test
          path: soul2/${{ steps.apk.outputs.path }}
          if-no-files-found: error
