name: Build Protected Soul2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Fetch Soul2 RC8
        run: |
          git clone --depth 1 --branch v2.0.0-rc.8 \
            https://git.kaki87.net/VibedByKaKi/soul-browser.git soul2

      - name: Verify RC8 source
        working-directory: soul2
        run: |
          test -f 'app/smali_classes3/com/mycompany/app/web/WebViewActivity$LocalWebViewClient.smali'
          grep -q 'shouldOverrideUrlLoading(Landroid/webkit/WebView;Ljava/lang/String;)Z' \
            'app/smali_classes3/com/mycompany/app/web/WebViewActivity$LocalWebViewClient.smali'
          grep -q 'shouldOverrideUrlLoading(Landroid/webkit/WebView;Landroid/webkit/WebResourceRequest;)Z' \
            'app/smali_classes3/com/mycompany/app/web/WebViewActivity$LocalWebViewClient.smali'
          echo "RC8 source verified."

      - name: Patch navigation blocker
        working-directory: soul2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/smali_classes3/com/mycompany/app/web/WebViewActivity$LocalWebViewClient.smali")
          text = path.read_text()

          string_sig = "shouldOverrideUrlLoading(Landroid/webkit/WebView;Ljava/lang/String;)Z"
          request_sig = "shouldOverrideUrlLoading(Landroid/webkit/WebView;Landroid/webkit/WebResourceRequest;)Z"

          def find_method(source, sig):
              return re.search(
                  r"(?ms)^\.method[^\n]*" + re.escape(sig) + r"\n.*?^\.end method$",
                  source
              )

          m = find_method(text, string_sig)
          if not m:
              raise SystemExit("String navigation method not found.")
          method = m.group(0)

          if "SOUL2_SAFETY_TEST" not in method:
              marker = "    .locals 4\n"
              if marker not in method:
                  raise SystemExit("Unexpected register layout in String navigation method.")

              inject = """    # SOUL2_SAFETY_TEST
              invoke-static {p2}, Landroid/net/Uri;->parse(Ljava/lang/String;)Landroid/net/Uri;
              move-result-object v3
              invoke-virtual {v3}, Landroid/net/Uri;->getHost()Ljava/lang/String;
              move-result-object v3
              if-eqz v3, :soul2_safety_continue_string
              const-string v1, "example.com"
              invoke-virtual {v3, v1}, Ljava/lang/String;->equalsIgnoreCase(Ljava/lang/String;)Z
              move-result v1
              if-eqz v1, :soul2_safety_check_subdomain
              const/4 v2, 0x1
              return v2
              :soul2_safety_check_subdomain
              const-string v1, ".example.com"
              invoke-virtual {v3, v1}, Ljava/lang/String;->endsWith(Ljava/lang/String;)Z
              move-result v1
              if-eqz v1, :soul2_safety_continue_string
              const/4 v2, 0x1
              return v2
              :soul2_safety_continue_string
          """
              method = method.replace(marker, marker + inject, 1)
              text = text[:m.start()] + method + text[m.end():]

          m = find_method(text, request_sig)
          if not m:
              raise SystemExit("WebResourceRequest navigation method not found.")
          method = m.group(0)

          if "SOUL2_SAFETY_TEST" not in method:
              needle = """    move-result-object p2

              .line 13
              invoke-static {v0, p1, p2}, Lcom/mycompany/app/web/WebViewActivity;->w0"""
              if needle not in method:
                  raise SystemExit("Expected RC8 URL conversion point not found.")

              inject = """    move-result-object p2

              # SOUL2_SAFETY_TEST
              invoke-static {p2}, Landroid/net/Uri;->parse(Ljava/lang/String;)Landroid/net/Uri;
              move-result-object v1
              invoke-virtual {v1}, Landroid/net/Uri;->getHost()Ljava/lang/String;
              move-result-object v1
              if-eqz v1, :soul2_safety_continue_request
              const-string v2, "example.com"
              invoke-virtual {v1, v2}, Ljava/lang/String;->equalsIgnoreCase(Ljava/lang/String;)Z
              move-result v2
              if-nez v2, :soul2_safety_block_request
              const-string v2, ".example.com"
              invoke-virtual {v1, v2}, Ljava/lang/String;->endsWith(Ljava/lang/String;)Z
              move-result v2
              if-eqz v2, :soul2_safety_continue_request

              :soul2_safety_block_request
              const/4 v2, 0x1
              return v2

              :soul2_safety_continue_request
              const/4 v2, 0x1

              .line 13
              invoke-static {v0, p1, p2}, Lcom/mycompany/app/web/WebViewActivity;->w0"""
              method = method.replace(needle, inject, 1)
              text = text[:m.start()] + method + text[m.end():]

          path.write_text(text)
          print("Patched only top-level navigation methods.")
          PY

      - name: Build APK
        working-directory: soul2
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Find APK
        id: apk
        working-directory: soul2
        run: |
          apk=$(find dist -maxdepth 1 -type f -name '*.apk' \
            ! -name '*-unsigned.apk' \
            ! -name '*-aligned.apk' | head -n 1)

          if [ -z "$apk" ]; then
            echo "No signed APK found"
            ls -la dist/
            exit 1
          fi

          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soul2-navigation-test
          path: soul2/${{ steps.apk.outputs.path }}
          if-no-files-found: error
