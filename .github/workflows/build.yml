name: Build Soul2 RC8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip unzip

      - name: Fetch Soul2 RC8
        run: |
          git clone --depth 1 --branch v2.0.0-rc.8 \
            https://git.kaki87.net/VibedByKaKi/soul-browser.git soul2

      - name: Build APK
        working-directory: soul2
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Find APK
        id: apk
        working-directory: soul2
        run: |
          apk=$(find dist -maxdepth 1 -type f -name '*.apk' \
            ! -name '*-unsigned.apk' \
            ! -name '*-aligned.apk' | head -n 1)

          if [ -z "$apk" ]; then
            echo "No signed APK found"
            ls -la dist/
            exit 1
          fi

          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soul2-rc8-baseline
          path: soul2/${{ steps.apk.outputs.path }}
          if-no-files-found: error
