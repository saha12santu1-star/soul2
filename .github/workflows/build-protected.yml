name: Build Protected Soul2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Fetch Soul2 RC8
        run: |
          git clone --depth 1 --branch v2.0.0-rc.8 \
            https://git.kaki87.net/VibedByKaKi/soul-browser.git soul2

      - name: Verify RC8 source
        working-directory: soul2
        run: |
          test -f 'app/smali_classes3/com/mycompany/app/web/WebViewActivity$LocalWebViewClient.smali'
          grep -q 'onPageStarted(Landroid/webkit/WebView;Ljava/lang/String;Landroid/graphics/Bitmap;)V' \
            'app/smali_classes3/com/mycompany/app/web/WebViewActivity$LocalWebViewClient.smali'
          echo "Verified RC8 onPageStarted hook."

      - name: Patch navigation safety test
        working-directory: soul2
        run: |
          mkdir -p app/smali_classes3/com/soul2/safety

          cat > app/smali_classes3/com/soul2/safety/SafetyBlocker.smali <<'EOF'
          .class public final Lcom/soul2/safety/SafetyBlocker;
          .super Ljava/lang/Object;
          
          .method public static isBlocked(Ljava/lang/String;)Z
              .locals 3
          
              if-eqz p0, :not_blocked
          
              invoke-static {p0}, Landroid/net/Uri;->parse(Ljava/lang/String;)Landroid/net/Uri;
              move-result-object v0
          
              invoke-virtual {v0}, Landroid/net/Uri;->getHost()Ljava/lang/String;
              move-result-object v0
          
              if-eqz v0, :not_blocked
          
              const-string v1, "example.com"
              invoke-virtual {v0, v1}, Ljava/lang/String;->equalsIgnoreCase(Ljava/lang/String;)Z
              move-result v2
              if-nez v2, :blocked
          
              const-string v1, ".example.com"
              invoke-virtual {v0, v1}, Ljava/lang/String;->endsWith(Ljava/lang/String;)Z
              move-result v2
              if-eqz v2, :not_blocked
          
              :blocked
              const/4 v0, 0x1
              return v0
          
              :not_blocked
              const/4 v0, 0x0
              return v0
          .end method
          EOF

          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re
          
          p = Path(
              "app/smali_classes3/com/mycompany/app/web/"
              "WebViewActivity$LocalWebViewClient.smali"
          )
          
          s = p.read_text()
          
          signature = (
              "onPageStarted("
              "Landroid/webkit/WebView;"
              "Ljava/lang/String;"
              "Landroid/graphics/Bitmap;)V"
          )
          
          pattern = re.compile(
              r"(?ms)^\.method[^\n]*"
              + re.escape(signature)
              + r"\n.*?^\.end method$"
          )
          
          m = pattern.search(s)
          if not m:
              raise SystemExit("ERROR: RC8 onPageStarted method not found.")
          
          method = m.group(0)
          
          if "Lcom/soul2/safety/SafetyBlocker;" in method:
              raise SystemExit("ERROR: Safety patch already present.")
          
          locals_match = re.search(r"(?m)^(\s*)\.locals\s+(\d+)$", method)
          if not locals_match:
              raise SystemExit("ERROR: onPageStarted .locals directive not found.")
          
          old_locals = int(locals_match.group(2))
          if old_locals != 3:
              raise SystemExit(
                  f"ERROR: Expected RC8 onPageStarted to use 3 locals; found {old_locals}."
              )
          
          method = method.replace(
              locals_match.group(0),
              f"{locals_match.group(1)}.locals 4",
              1
          )
          
          injection = """invoke-static {p2}, Lcom/soul2/safety/SafetyBlocker;->isBlocked(Ljava/lang/String;)Z
          move-result v3
          if-eqz v3, :soul2_safety_continue
          invoke-virtual {p1}, Landroid/webkit/WebView;->stopLoading()V
          return-void
          :soul2_safety_continue
          
          """
          
          insert_at = method.find("\n", method.find(".locals 4")) + 1
          method = method[:insert_at] + injection + method[insert_at:]
          
          s = s[:m.start()] + method + s[m.end():]
          p.write_text(s)
          
          print("Patched RC8 onPageStarted safely.")
          PY

          python3 /tmp/patch.py

      - name: Build APK
        working-directory: soul2
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Find APK
        id: apk
        working-directory: soul2
        run: |
          apk=$(find dist -maxdepth 1 -type f -name '*.apk' \
            ! -name '*-unsigned.apk' \
            ! -name '*-aligned.apk' | head -n 1)

          if [ -z "$apk" ]; then
            echo "No signed APK found"
            ls -la dist/
            exit 1
          fi

          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soul2-protected-onpagestart-test
          path: soul2/${{ steps.apk.outputs.path }}
          if-no-files-found: error
