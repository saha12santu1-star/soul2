name: Build Soul2 Navigation Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Install required tools
        run: sudo apt-get update && sudo apt-get install -y python3 curl zip unzip

      - name: Fetch Soul2 RC8
        run: |
          git clone --depth 1 --branch v2.0.0-rc.8 \
            https://git.kaki87.net/VibedByKaKi/soul-browser.git soul2

      - name: Patch top-level navigation methods
        working-directory: soul2
        run: |
          cat > /tmp/patch_soul2.py <<'PYCODE'
          from pathlib import Path

          path = Path('app/smali_classes3/com/mycompany/app/web/WebViewActivity$LocalWebViewClient.smali')
          if not path.is_file():
              raise SystemExit(f'RC8 source file not found: {path}')
          text = path.read_text()

          def patch(signature, marker, old_locals, new_locals, code_lines):
              global text
              if text.count(signature) != 1:
                  raise SystemExit(f'Expected exactly one method: {signature}')
              start = text.index(signature)
              end = text.index('.end method', start) + len('.end method')
              method = text[start:end]
              if marker in method:
                  raise SystemExit(f'Patch already present: {marker}')
              old = f'    .locals {old_locals}\n'
              if method.count(old) != 1:
                  raise SystemExit(f'Unexpected local count for {signature}')
              method = method.replace(old, f'    .locals {new_locals}\n', 1)
              directive = f'    .locals {new_locals}\n'
              code = '\n'.join(code_lines) + '\n'
              method = method.replace(directive, directive + code, 1)
              text = text[:start] + method + text[end:]

          patch(
              '.method public final shouldOverrideUrlLoading(Landroid/webkit/WebView;Landroid/webkit/WebResourceRequest;)Z',
              'SOUL2_EXAMPLE_DOMAIN_TEST_REQUEST', 3, 5,
              [
                  '    # SOUL2_EXAMPLE_DOMAIN_TEST_REQUEST',
                  '    if-eqz p2, :soul2_test_allow_request',
                  '    invoke-interface {p2}, Landroid/webkit/WebResourceRequest;->getUrl()Landroid/net/Uri;',
                  '    move-result-object v3',
                  '    if-eqz v3, :soul2_test_allow_request',
                  '    invoke-virtual {v3}, Landroid/net/Uri;->toString()Ljava/lang/String;',
                  '    move-result-object v3',
                  '    const-string v4, "example.com"',
                  '    invoke-virtual {v3, v4}, Ljava/lang/String;->contains(Ljava/lang/CharSequence;)Z',
                  '    move-result v3',
                  '    if-eqz v3, :soul2_test_allow_request',
                  '    const/4 v3, 0x1',
                  '    return v3',
                  '    :soul2_test_allow_request'
              ]
          )

          patch(
              '.method public final shouldOverrideUrlLoading(Landroid/webkit/WebView;Ljava/lang/String;)Z',
              'SOUL2_EXAMPLE_DOMAIN_TEST_STRING', 4, 5,
              [
                  '    # SOUL2_EXAMPLE_DOMAIN_TEST_STRING',
                  '    if-eqz p2, :soul2_test_allow_string',
                  '    const-string v4, "example.com"',
                  '    invoke-virtual {p2, v4}, Ljava/lang/String;->contains(Ljava/lang/CharSequence;)Z',
                  '    move-result v4',
                  '    if-eqz v4, :soul2_test_allow_string',
                  '    const/4 v4, 0x1',
                  '    return v4',
                  '    :soul2_test_allow_string'
              ]
          )

          path.write_text(text)
          check = path.read_text()
          for marker in ('SOUL2_EXAMPLE_DOMAIN_TEST_REQUEST', 'SOUL2_EXAMPLE_DOMAIN_TEST_STRING'):
              if check.count(marker) != 1:
                  raise SystemExit(f'Patch verification failed: {marker}')
          print('Patched and checked both RC8 navigation methods.')
          PYCODE
          python3 /tmp/patch_soul2.py

      - name: Build APK
        working-directory: soul2
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Find APK
        id: apk
        working-directory: soul2
        run: |
          apk=$(find dist -maxdepth 1 -type f -name '*.apk' \
            ! -name '*-unsigned.apk' ! -name '*-aligned.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "No signed APK found"
            ls -la dist/
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: soul2-navigation-test
          path: soul2/${{ steps.apk.outputs.path }}
          if-no-files-found: error
